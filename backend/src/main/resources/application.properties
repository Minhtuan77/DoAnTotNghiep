# ==========================================
# APPLICATION
# ==========================================
spring.application.name=backend


# ==========================================
# SERVER
# ==========================================
server.port=8080


# ==========================================
# DATABASE - MYSQL
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/da
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# ==========================================
# JWT
# ==========================================
jwt.secret=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000

# ==========================================
# VNPAY SANDBOX
# ==========================================
# Không commit TmnCode/HashSecret thật vào Git. Đặt bằng Environment Variables.
vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8080/api/payments/vnpay/return}
vnpay.version=2.1.0
vnpay.command=pay
vnpay.order-type=other
vnpay.locale=vn
vnpay.expire-minutes=15
